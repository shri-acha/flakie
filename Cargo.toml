[package]
name = "flakie"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
description = "Configurable, resumable retries for work against flaky sources"

[features]
default = ["s3"]
s3 = ["dep:aws-sdk-s3"]
scripting = ["dep:rhai"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-sdk-s3 = { version = "1.155.0", optional = true }
tokio = { version = "1.54.1", features = ["rt", "time", "fs", "io-util"] }
tracing = "0.1.44"
rhai = { version = "1.27", optional = true, features = ["sync", "no_module"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
